substitutions:
  _SERVICE_NAME: frontend-staging
  _SUPABASE_URL_SECRET: SUPABASE_URL_STAGING
  _SUPABASE_ANON_KEY_SECRET: SUPABASE_ANON_KEY_STAGING
  _SUPABASE_SVC_KEY_SECRET: SUPABASE_SERVICE_ROLE_KEY_STAGING

availableSecrets:
  secretManager:
    - versionName: projects/todo-gcp-498308/secrets/$_SUPABASE_ANON_KEY_SECRET/versions/latest
      env: NEXT_PUBLIC_SUPABASE_ANON_KEY

steps:
  # NEXT_PUBLIC_SUPABASE_URL is NOT baked here. The browser client derives it
  # from window.location.origin at runtime, so it works on any deployment URL.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: [DOCKER_BUILDKIT=1]
    args:
      - -c
      - |
        docker build \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=$$NEXT_PUBLIC_SUPABASE_ANON_KEY \
          -t us-central1-docker.pkg.dev/todo-gcp-498308/todo-app/frontend:$SHORT_SHA \
          .
    secretEnv: [NEXT_PUBLIC_SUPABASE_ANON_KEY]

  - name: gcr.io/cloud-builders/docker
    args: [push, us-central1-docker.pkg.dev/todo-gcp-498308/todo-app/frontend:$SHORT_SHA]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=us-central1-docker.pkg.dev/todo-gcp-498308/todo-app/frontend:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=cloud-run-sa@todo-gcp-498308.iam.gserviceaccount.com
      - --set-secrets=SUPABASE_URL=$_SUPABASE_URL_SECRET:latest,SUPABASE_SERVICE_ROLE_KEY=$_SUPABASE_SVC_KEY_SECRET:latest
      - --project=todo-gcp-498308

options:
  logging: CLOUD_LOGGING_ONLY
